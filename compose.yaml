name: strata-local

# Upstream's prebuilt CUDA 13 image, pinned by digest. It matches the vendor/Strata pin.
x-image: &image
  image: ghcr.io/niko1221/strata:0.2.2-cuda13@sha256:17e96f76fb85ee47b445b38ebfe9e4190b96ebde522e109d40efa2f2404a4503

x-devices: &devices
  resources:
    reservations:
      devices:
        - driver: nvidia
          device_ids:
            - ${PRIMARY_GPU_UUID:?Set PRIMARY_GPU_UUID in .env}
            - ${PEER_GPU_UUID:?Set PEER_GPU_UUID in .env}
          capabilities: [gpu]

x-policy: &policy
  PRIMARY_GPU_UUID: ${PRIMARY_GPU_UUID:?Set PRIMARY_GPU_UUID in .env}
  PEER_GPU_UUID: ${PEER_GPU_UUID:?Set PEER_GPU_UUID in .env}
  PRIMARY_POWER_W: ${PRIMARY_POWER_W:-300}
  PEER_POWER_W: ${PEER_POWER_W:-350}

services:
  power-policy:
    <<: *image
    init: true
    restart: unless-stopped
    cap_drop: [ALL]
    cap_add: [SYS_ADMIN]
    security_opt: [no-new-privileges:true]
    network_mode: none
    read_only: true
    tmpfs: [/data]  # The image declares a /data volume; this service needs none.
    environment:
      <<: *policy
      NVIDIA_DRIVER_CAPABILITIES: utility
    entrypoint: ["/opt/strata/terminal/python/bin/python3", "/deployment/power-policy.py"]
    volumes:
      - ./docker/power-policy.py:/deployment/power-policy.py:ro
    deploy: *devices
    healthcheck:
      test: ["CMD", "/opt/strata/terminal/python/bin/python3", "/deployment/power-policy.py", "--check"]
      interval: 10s
      timeout: 10s
      start_period: 15s
      retries: 3
    logging:
      options: {max-size: "1m", max-file: "2"}

  strata:
    <<: *image
    init: true
    restart: unless-stopped
    depends_on:
      power-policy:
        condition: service_healthy
    stop_signal: SIGTERM
    stop_grace_period: 60s
    ports:
      - "${STRATA_BIND_HOST:-127.0.0.1}:${STRATA_PORT:-8080}:8080"
    environment:
      # The primary is logical CUDA0; the peer is CUDA1. The configs name no "gpu", so the server keeps this order.
      # power-policy rejects equal UUIDs before this service starts.
      CUDA_VISIBLE_DEVICES: ${PRIMARY_GPU_UUID:?Set PRIMARY_GPU_UUID in .env},${PEER_GPU_UUID:?Set PEER_GPU_UUID in .env}
      CUDA_DEVICE_ORDER: PCI_BUS_ID
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      STRATA_ATTN_DAILY: "1"
      # Without a key, the server answers only to IPs and the names listed here (DNS rebinding protection).
      # Prometheus reaches it as "strata"; add the names LAN clients use in .env.
      STRATA_ALLOWED_HOSTS: strata,${STRATA_ALLOWED_HOSTS:-}
    # The trusted LAN needs no API key; --no-api-key states that, and the server logs one warning.
    entrypoint: ["/opt/strata/terminal/python/bin/python3", "/opt/strata/terminal/serve/server.py"]
    command: ["--engine", "strata", "--config", "/config/strata.json",
              "--host", "0.0.0.0", "--port", "8080", "--no-api-key"]
    volumes:
      - type: bind
        source: ./config/${STRATA_CONFIG:-strata-iq3_s.json}
        target: /config/strata.json
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${STRATA_DATA_DIR:?Set STRATA_DATA_DIR in .env}
        target: /models-data
        read_only: true
        bind: {create_host_path: false}
      - strata-state:/data
    ulimits:
      memlock: {soft: -1, hard: -1}
    deploy: *devices
    healthcheck:
      test: ["CMD", "/opt/strata/terminal/python/bin/python3", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8080/health', timeout=8)"]
      interval: 30s
      timeout: 10s
      start_period: 10m
      retries: 3
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

volumes:
  strata-state:
